[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wow_addons"
version = "0.0.0"
description = ""
authors = [{ name = "FatNutt", email = "fatnutt@pm.me" }]
requires-python = ">=3.14,<4.0"
dependencies = ["pre-commit (>=4.5.1,<5.0.0)", "isort (>=8.0.0,<9.0.0)", "ruff (>=0.15.2,<0.16.0)"]

[tool.poetry]
packages = [{ include = 'scripts' }]

[tool.poetry.scripts]
link-addon = 'scripts.symlink_addon:main'

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]
